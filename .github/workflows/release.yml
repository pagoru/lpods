name: Release

# Linux only: a v* tag builds the Fedora RPM and publishes a GitHub release with it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: >
          dnf install -y --setopt=install_weak_deps=False
          dotnet-sdk-10.0 nodejs npm rpm-build desktop-file-utils systemd-rpm-macros git tar gzip gh

      - uses: actions/checkout@v4

      - name: Check the tag matches the spec version
        run: |
          version=$(rpmspec -q --qf '%{version}\n' linux/packaging/lpods.spec | head -1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match spec version $version"; exit 1; }

      - name: Build the web pages
        run: cd ui && npm ci --no-audit --no-fund && node build.mjs

      - name: Build the RPM
        run: |
          version=$(rpmspec -q --qf '%{version}\n' linux/packaging/lpods.spec | head -1)
          mkdir -p ~/rpmbuild/SOURCES
          git config --global --add safe.directory "$PWD"
          git archive --prefix="lpods-$version/" -o ~/rpmbuild/SOURCES/lpods-$version.tar.gz HEAD
          rpmbuild -bb linux/packaging/lpods.spec

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ~/rpmbuild/RPMS/noarch/lpods-*.rpm --repo "$GITHUB_REPOSITORY" --title "LPods ${GITHUB_REF_NAME#v}" --generate-notes
